name: Docs

# Builds the mkdocs site (mkdocs.yml, docs/) and deploys it to GitHub Pages on every push to main.
# Requires Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install mkdocs
      run: pip install mkdocs-material==9.8.0
    - name: Build
      run: mkdocs build --strict -d site
      env:
        NO_MKDOCS_2_WARNING: 1
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v4
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
